name: Build Status

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - LICENSE
      - README.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - name: ubuntu-latest
            dist_path: dist
            os: ubuntu-latest
            python: "3.11"
            target: native
          - name: ubuntu-24.04-arm
            dist_path: dist
            os: ubuntu-24.04-arm
            python: "3.11"
            target: native
          - name: macos-latest
            dist_path: dist
            os: macos-latest
            python: "3.11"
            target: native
          - name: windows-latest
            dist_path: dist
            os: windows-latest
            python: "3.11"
            target: native
          

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@6e1b91a408ea89f49bc8aff8724f83826f7b5446
        with:
          version: ${{ matrix.python }}

      - name: Setup Node.js
        uses: actions-ext/node/setup@0ea5bdcd24d2488b28e16bf611b446a2f8e1e12f
        with:
          version: 22.x
        if: matrix.target == 'native'

      - name: Setup C++
        uses: actions-ext/cpp/setup@c2b1e90366b3a1c628a1df0748135f5e345ab26f

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        if: matrix.target == 'native'

      - name: Install dependencies
        run: make develop
        if: matrix.target == 'native'

      - name: Lint
        run: make lint
        if: matrix.name == 'ubuntu-latest'

      - name: Checks
        run: make checks
        if: matrix.name == 'ubuntu-latest'

      - name: Test
        run: make coverage
        if: matrix.target == 'native'

      - name: Build and test Pyodide wheel
        run: make test-pyodide
        if: matrix.target == 'pyodide'

      - name: Upload test results (Python)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-${{ matrix.name }}
          path: junit.xml
        if: matrix.name == 'ubuntu-latest'

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        with:
          files: '**/junit.xml'
        if: matrix.name == 'ubuntu-latest'

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: matrix.target == 'native'

      - name: Install build dependencies
        run: pip install cibuildwheel
        if: matrix.target == 'native'

      - name: Build distributions (Linux x86_64)
        run: |
          rm -rf dist
          make dist-py-sdist
          make dist-py-wheel
          make dist-check
        env:
          CIBW_BUILD: "cp311-manylinux*"
          CIBW_ARCHS_LINUX: native
          CIBW_BUILD_VERBOSITY: 3
        if: matrix.name == 'ubuntu-latest'

      - name: Build distributions (Linux ARM64)
        run: |
          rm -rf dist
          make dist-py-wheel
          make dist-check
        env:
          CIBW_BUILD: "cp311-manylinux*"
          CIBW_ARCHS_LINUX: native
          CIBW_BUILD_VERBOSITY: 3
        if: matrix.name == 'ubuntu-24.04-arm'

      - name: Build distributions (macOS)
        run: |
          rm -rf dist
          make dist-py-wheel
        env:
          CIBW_BUILD: "cp311-macos*"
          CIBW_BUILD_VERBOSITY: 3
        if: matrix.name == 'macos-latest'

      - name: Build distributions (Windows)
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          make dist-py-wheel
        env:
          CIBW_BUILD: "cp311-win_amd64"
        if: matrix.name == 'windows-latest'

      - name: Test wheel
        uses: actions-ext/python/test-wheel@6e1b91a408ea89f49bc8aff8724f83826f7b5446
        with:
          module: python_template_cppjswasm
        if: matrix.target == 'native' && runner.os == 'Linux'

      - name: Test source distribution
        uses: actions-ext/python/test-sdist@6e1b91a408ea89f49bc8aff8724f83826f7b5446
        with:
          module: python_template_cppjswasm
        if: matrix.name == 'ubuntu-latest'

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ matrix.name }}
          path: ${{ matrix.dist_path }}
