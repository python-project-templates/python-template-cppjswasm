        uses: actions-ext/python/setup@ec67f82b3bd863948308a41ecb9e70547cbb19c7
>>>>>>> after updating
        with:
          version: ${{ matrix.python }}

      - name: Setup Node.js
<<<<<<< before updating
        uses: actions-ext/node/setup@b0536d87c5e92c924bc8667f566f620758280825
=======
        uses: actions-ext/node/setup@34d0fdbdca883e4d0a2da0bcd0fa460fd40b80e7
>>>>>>> after updating
        with:
          version: 22.x
        if: matrix.target == 'native'

      - name: Setup C++
        uses: actions-ext/cpp/setup@22ebafc6f57971978e964f9977333ac98a7c49d9

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        if: matrix.target == 'native'

      - name: Install dependencies
        run: make develop
        if: matrix.target == 'native'

      - name: Lint
        run: make lint
        if: matrix.name == 'ubuntu-latest'

      - name: Checks
        run: make checks
        if: matrix.name == 'ubuntu-latest'

      - name: Test
        run: make coverage
        if: matrix.target == 'native'

      - name: Build and test Pyodide wheel
        run: make test-pyodide
        if: matrix.target == 'pyodide'

      - name: Upload test results (Python)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-${{ matrix.name }}
          path: junit.xml
        if: matrix.name == 'ubuntu-latest'

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        with:
          files: '**/junit.xml'
        if: matrix.name == 'ubuntu-latest'

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: matrix.target == 'native'

      - name: Install build dependencies
        run: pip install cibuildwheel
        if: matrix.target == 'native'

      - name: Build distributions (Linux x86_64)
        run: |
          rm -rf dist
          make dist-py-sdist
          make dist-py-wheel
          make dist-check
        env:
          CIBW_BUILD: "cp311-manylinux*"
          CIBW_ARCHS_LINUX: native
          CIBW_BUILD_VERBOSITY: 3
        if: matrix.name == 'ubuntu-latest'

      - name: Build distributions (Linux ARM64)
        run: |
          rm -rf dist
          make dist-py-wheel
          make dist-check
        env:
          CIBW_BUILD: "cp311-manylinux*"
          CIBW_ARCHS_LINUX: native
          CIBW_BUILD_VERBOSITY: 3
        if: matrix.name == 'ubuntu-24.04-arm'

      - name: Build distributions (macOS)
        run: |
          rm -rf dist
          make dist-py-wheel
        env:
          CIBW_BUILD: "cp311-macos*"
          CIBW_BUILD_VERBOSITY: 3
        if: matrix.name == 'macos-latest'

      - name: Build distributions (Windows)
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          make dist-py-wheel
        env:
          CIBW_BUILD: "cp311-win_amd64"
        if: matrix.name == 'windows-latest'

